experimental:
  plugins:
    #use to show real IPs in logs
    cloudflarewarp:
      moduleName: github.com/BetterCorp/cloudflarewarp
      version: v1.3.3

    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.2

api:
  dashboard: true
  debug: true

entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
    forwardedHeaders:
      # Trust the Docker network where cloudflared-tunnel runs
      # Adjust CIDR if your 'proxy' network uses a different range
      trustedIPs:
        - "172.18.0.0/16"

serversTransport:
  insecureSkipVerify: true # Keep if needed for self-signed certs on backend (like Proxmox default)

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /config.yaml
    
certificatesResolvers:
  cloudflare:
    acme:
      email: <YOUR_CLOUDFLARE_EMAIL>
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      #caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging. Use this if you want to use a staging CA server for testing purposes to avoid being blocked for one day/week in case something is wrong with your settings.
      dnsChallenge:
        provider: cloudflare
        #disablePropagationCheck: true # uncomment this if you have issues pulling certificates through cloudflare, By setting this flag to true disables the need to wait for the propagation of the TXT record to all authoritative name servers.
        #delayBeforeCheck: 60s # uncomment along with disablePropagationCheck if needed to ensure the TXT record is ready before verification is attempted 
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

accessLog:
  filePath: "var/log/traefik/access.log"
  format: json
  filters:
    statusCodes:
      - "200-299" # log successful http requests
      - "400-599" # log failed http requests
  # collect logs as in-memory buffer before writing into log file
  bufferingSize: 0 # Or set a buffer size if desired
  fields:
    headers:
      defaultMode: drop # drop all headers per default
      names:
          User-Agent: keep # log user agent strings

log: # Optional: Add general log level if needed
  level: INFO # Or INFO, WARNING, ERROR
  filePath: "/var/log/traefik/traefik.log"